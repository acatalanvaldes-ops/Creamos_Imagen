<script>
// (Sin datos de ejemplo: las ventas reales se cargan desde la nube)

// ============================================================
// CONEXIÓN A BASE DE DATOS (NUBE)
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbxP5-vB59e80qpXdx4AcCyS28C4H58thdh0XXtLcDWZD8Q_47fDbBvLn1ahqx7RoJor/exec";
const CLOUD_TOKEN = "b5bd161b4ef581c6114b7bb4";

// El backend (Google Apps Script) a veces devuelve una falla transitoria —una
// página de error en vez de JSON, o un HTTP no-OK— que se resuelve sola al
// reintentar. Sin reintentos, esas fallas pasajeras se veían igual que una
// caída real de la conexión (alertas de "no se pudo conectar" de más).
function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
const CLOUD_INTENTOS = 3;
// Google Apps Script a veces responde muy lento bajo carga (varios segundos, a
// veces mucho mas) en vez de fallar de inmediato. Sin un limite, un intento
// lento se queda esperando indefinidamente y bloquea la pagina por minutos en
// vez de reintentar o avisar. CLOUD_TIMEOUT_MS pone un tope por intento.
const CLOUD_TIMEOUT_MS = 12000;
async function fetchConTimeout(url, opts) {
  const controller = new AbortController();
  const timer = setTimeout(function () { controller.abort(); }, CLOUD_TIMEOUT_MS);
  try {
    return await fetch(url, Object.assign({}, opts, { signal: controller.signal }));
  } finally {
    clearTimeout(timer);
  }
}

async function saveToCloud(key, dataObj) {
  let ultimoError;
  for (let intento = 0; intento < CLOUD_INTENTOS; intento++) {
    try {
      const res = await fetchConTimeout(API_URL, { method: 'POST', body: JSON.stringify({ key: key, value: JSON.stringify(dataObj), token: CLOUD_TOKEN }) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // El backend responde HTTP 200 también cuando falla (con estado "error").
      const json = await res.json();
      if (json.estado === 'error') throw new Error(json.detalle || 'Error del servidor');
      return true;
    } catch (e) {
      ultimoError = e;
      if (intento < CLOUD_INTENTOS - 1) await esperar(500 * (intento + 1));
    }
  }
  console.error("Error guardando en la nube", ultimoError);
  return false;
}

async function loadFromCloud(key) {
  let ultimoError;
  for (let intento = 0; intento < CLOUD_INTENTOS; intento++) {
    try {
      const res = await fetchConTimeout(API_URL + "?key=" + key + "&token=" + CLOUD_TOKEN);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (json.estado === 'error') throw new Error(json.detalle || 'Error del servidor');
      return json.valor ? JSON.parse(json.valor) : null;
    } catch (e) {
      ultimoError = e;
      if (intento < CLOUD_INTENTOS - 1) await esperar(500 * (intento + 1));
    }
  }
  console.error("Error cargando de la nube", ultimoError);
  return null;
}

// Version "estricta": en vez de devolver null ante cualquier falla (red, HTTP,
// o error del servidor), lanza una excepción tras agotar los reintentos. Así
// se puede distinguir "la nube respondió que está vacío" de "no se pudo
// confirmar el estado de la nube", y evitar sobreescribir datos reales con un
// guardado hecho tras una carga fallida (el mismo problema que borró el
// historial de ventas real).
async function loadFromCloudStrict(key) {
  let ultimoError;
  for (let intento = 0; intento < CLOUD_INTENTOS; intento++) {
    try {
      const res = await fetchConTimeout(API_URL + "?key=" + key + "&token=" + CLOUD_TOKEN);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (json.estado === 'error') throw new Error(json.detalle || 'Error del servidor');
      return json.valor ? JSON.parse(json.valor) : null;
    } catch (e) {
      ultimoError = e;
      if (intento < CLOUD_INTENTOS - 1) await esperar(500 * (intento + 1));
    }
  }
  throw ultimoError;
}

// Google Sheets limita cada celda a 50.000 caracteres. El array de ventas ya
// superó ese límite una vez (por eso una carga con datos incompletos terminó
// sobreescribiendo la nube). Para que esto no vuelva a pasar, las ventas se
// guardan repartidas ("sharded") en varias llaves de la nube si hace falta:
// STORAGE_KEY guarda el primer bloque + comDefPct + filtroMes + shardCount,
// y STORAGE_KEY + "_sh" + i guarda cada bloque adicional.
var MAX_SHARD_CHARS = 40000; // margen de seguridad bajo el límite de 50.000

function splitVentasEnBloques(ventasArray) {
  var bloques = [];
  var actual = [];
  var largoActual = 2; // "[" + "]"
  for (var i = 0; i < ventasArray.length; i++) {
    var entryStr = JSON.stringify(ventasArray[i]);
    var addLen = entryStr.length + 1;
    if (largoActual + addLen > MAX_SHARD_CHARS && actual.length > 0) {
      bloques.push(actual);
      actual = [];
      largoActual = 2;
    }
    actual.push(ventasArray[i]);
    largoActual += addLen;
  }
  bloques.push(actual); // aunque quede vacío, para poder guardar comDefPct/filtroMes
  return bloques;
}

// Devuelve true solo si TODOS los bloques se guardaron. Los bloques extra se
// escriben antes que el principal (que es el que dice cuántos bloques hay),
// para que nadie lea un shardCount que apunte a bloques aún no escritos.
async function saveToCloudSharded(ventasArray, comDefPct, filtroMes) {
  var bloques = splitVentasEnBloques(ventasArray);
  var shardCount = bloques.length;
  var pedidos = [];
  for (var i = 1; i < shardCount; i++) {
    pedidos.push(saveToCloud(STORAGE_KEY + '_sh' + i, { ventas: bloques[i] }));
  }
  var oks = await Promise.all(pedidos);
  if (oks.indexOf(false) !== -1) return false;
  var principal = { ventas: bloques[0], comDefPct: comDefPct, filtroMes: filtroMes, shardCount: shardCount };
  return await saveToCloud(STORAGE_KEY, principal);
}

// Carga estricta y con bloques: lanza si algún bloque no puede confirmarse.
async function loadFromCloudSharded() {
  var principal = await loadFromCloudStrict(STORAGE_KEY);
  if (!principal) return null;
  var ventas = (principal.ventas || []).slice();
  var shardCount = principal.shardCount || 1;
  // Los bloques extra se piden en paralelo y se unen en orden.
  var pedidos = [];
  for (var i = 1; i < shardCount; i++) pedidos.push(loadFromCloudStrict(STORAGE_KEY + '_sh' + i));
  var bloques = await Promise.all(pedidos);
  bloques.forEach(function (bloque) {
    if (bloque && bloque.ventas) ventas = ventas.concat(bloque.ventas);
  });
  return { ventas: ventas, comDefPct: principal.comDefPct, filtroMes: principal.filtroMes };
}

// ============================================================
// CONSTANTES
// ============================================================
var PRODUCTOS   = ["Bandanas","Banderas","Banner","Bolsas","Camisetas","Conjuntos","Cortinas","Cuadros","Estampados","Lienzo","Mantas","Morral","Pañuelos","Sublimación"];
var FORMAS_PAGO = ["Efectivo","Transferencia","Webpay"];
var WEBPAY      = "Webpay";
var COM_WP_PCT  = 2;
var IVA         = 1.19;
var PC = {
  "Efectivo":      {bg:"#DCFCE7",txt:"#166534"},
  "Transferencia": {bg:"#FEF9C3",txt:"#854D0E"},
  "Webpay":        {bg:"#EFF6FF",txt:"#1E40AF"}
};

// ============================================================
// LOGICA FINANCIERA
// ============================================================
function comWP(base, fp)     { return fp===WEBPAY ? Math.round(base*COM_WP_PCT/100) : 0; }
function valCli(base, fp)    { return base + comWP(base, fp); }
function comF(base, pct)     { return Math.round(base*pct/100); }
function ingF(base, pct)     { return base - comF(base, pct); }
function fmt(n)              { return n==null ? "" : "$"+Math.round(n).toLocaleString("es-CO"); }
function fDate(f)            { return new Date(f+"T12:00").toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"}); }

// ============================================================
// PERSISTENCIA (localStorage + Nube)
// ============================================================
var STORAGE_KEY = "sublipro_v2";

// Se pone en true solo si la carga inicial desde la nube pudo confirmarse
// (éxito o "está vacío"). Mientras sea false, guardarDatos() NO manda nada a
// la nube (solo guarda localmente), para no arriesgarse a sobreescribir datos
// reales con un estado incompleto por una carga que falló.
var cargaVentasOk = false;

// ------------------------------------------------------------
// SINCRONIZACIÓN CON LA NUBE
// ------------------------------------------------------------
// Antes cada guardado subía la lista completa de este equipo "a ciegas":
//  - si la subida fallaba, la venta quedaba solo en este navegador sin aviso;
//  - si otro equipo había agregado ventas desde que se abrió esta página, se
//    borraban de la nube al subir una lista que no las tenía;
//  - al recargar, la nube reemplazaba la copia local y las ventas que nunca
//    se subieron se perdían.
// Ahora cada guardado relee la nube y fusiona por id antes de subir, y se
// recuerda qué ids ya estaban confirmados en la nube (SYNC_IDS_KEY) para
// distinguir "otro equipo la borró" de "este equipo aún no la subió".
var SYNC_IDS_KEY = STORAGE_KEY + "_ids_nube";
var NO_SUBIDAS_KEY = STORAGE_KEY + "_no_subidas";
var idsEnNube = null;          // Set de ids confirmados en la nube
var _syncTimer = null, _syncEnCurso = false, _syncPendiente = false, _syncReintento = null;
var hayCambiosSinSubir = false;

function leerIdsNube() {
  try { var a = JSON.parse(localStorage.getItem(SYNC_IDS_KEY)); return Array.isArray(a) ? new Set(a) : null; } catch(e) { return null; }
}
function recordarIdsNube(ventas) {
  idsEnNube = new Set(ventas.map(function(v){ return v.id; }));
  try { localStorage.setItem(SYNC_IDS_KEY, JSON.stringify(Array.from(idsEnNube))); } catch(e) {}
}

function mostrarEstadoGuardado(st) {
  var el = document.getElementById('sync-badge');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sync-badge';
    el.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:9000;padding:9px 14px;border-radius:8px;font-size:12px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.15);border:1.5px solid;transition:opacity .3s;max-width:calc(100vw - 32px)';
    document.body.appendChild(el);
  }
  clearTimeout(el._t);
  el.style.opacity = '1'; el.style.display = 'block';
  if (st === 'guardando') { el.style.background = '#fff'; el.style.borderColor = '#E7E2D9'; el.style.color = '#78716C'; el.textContent = '⏳ Guardando en la nube…'; }
  else if (st === 'ok') { el.style.background = '#ECFDF5'; el.style.borderColor = '#0D7A6B'; el.style.color = '#0D7A6B'; el.textContent = '✓ Guardado en la nube';
    el._t = setTimeout(function(){ el.style.opacity = '0'; setTimeout(function(){ el.style.display = 'none'; }, 300); }, 2500); }
  else if (st === 'error') { el.style.background = '#FEF2F2'; el.style.borderColor = '#C0392B'; el.style.color = '#C0392B'; el.textContent = '⚠ No se pudo subir a la nube. Se reintentará solo; no cierres esta página.'; }
  else if (st === 'local') { el.style.background = '#FEF3E2'; el.style.borderColor = '#C8973A'; el.style.color = '#92400E'; el.textContent = '💾 Guardado solo en este equipo: recarga la página (F5) con conexión para subirlo.'; }
}

function guardarDatos() {
  try {
    var datos = {
      ventas:    state.ventas,
      comDefPct: state.comDefPct,
      filtroMes: state.filtroMes
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
  } catch(e) {}
  if (!cargaVentasOk) {
    console.warn("No se pudo confirmar la conexión con la nube al abrir esta página; no se sube nada hasta recargar (F5).");
    mostrarEstadoGuardado('local');
    return;
  }
  hayCambiosSinSubir = true;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(sincronizarNube, 400);
}

async function sincronizarNube() {
  if (_syncEnCurso) { _syncPendiente = true; return; }
  _syncEnCurso = true;
  clearTimeout(_syncReintento);
  mostrarEstadoGuardado('guardando');
  var ok = false;
  try {
    // 1. Leer lo que hay AHORA en la nube (puede haber ventas de otro equipo).
    var nube = await loadFromCloudSharded();
    var ventasNube = (nube && nube.ventas) ? nube.ventas : [];
    // 2. Fusionar: las ventas de este equipo mandan (incluye ediciones); de la
    //    nube se agregan las que este equipo no conoce. Las que este equipo ya
    //    había visto en la nube y ya no tiene, las borró aquí: no se reagregan.
    var locales = new Set(state.ventas.map(function(v){ return v.id; }));
    var nuevasDeOtros = ventasNube.filter(function(v){
      return !locales.has(v.id) && !(idsEnNube && idsEnNube.has(v.id));
    });
    var fusion = state.ventas.concat(nuevasDeOtros);
    // 3. Subir la fusión.
    ok = await saveToCloudSharded(fusion, state.comDefPct, state.filtroMes);
    if (ok) {
      recordarIdsNube(fusion);
      if (nuevasDeOtros.length) {
        state.ventas = state.ventas.concat(nuevasDeOtros);
        render();
      }
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ventas: state.ventas, comDefPct: state.comDefPct, filtroMes: state.filtroMes })); } catch(e) {}
    }
  } catch (e) {
    console.error('Error sincronizando ventas con la nube', e);
    ok = false;
  } finally {
    _syncEnCurso = false;
  }
  if (_syncPendiente) {
    // Hubo más cambios mientras se subía: se vuelve a sincronizar con lo último.
    _syncPendiente = false;
    sincronizarNube();
    return;
  }
  if (ok) {
    hayCambiosSinSubir = false;
    mostrarEstadoGuardado('ok');
  } else {
    mostrarEstadoGuardado('error');
    _syncReintento = setTimeout(sincronizarNube, 30000);
  }
}

// Avisar antes de cerrar o recargar si hay ventas que todavía no llegan a la nube.
window.addEventListener('beforeunload', function (e) {
  if (hayCambiosSinSubir) { e.preventDefault(); e.returnValue = ''; }
});

function cargarDatos() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      state.ventas = [];
      return;
    }
    var datos = JSON.parse(raw);
    state.ventas = (datos.ventas && datos.ventas.length > 0) ? datos.ventas : [];
    if (datos.comDefPct) state.comDefPct = datos.comDefPct;
    if (datos.filtroMes !== undefined) state.filtroMes = datos.filtroMes;
  } catch(e) {
    state.ventas = [];
  }
}

function borrarDatos() {
  if (!confirm("Borrar TODOS los datos guardados? Esta accion no se puede deshacer.")) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  location.reload();
}

// ============================================================
// ESTADO
// ============================================================
var state = {
  ventas: [],
  tab:"ventas",
  filtroMes:"",
  rangoDesde:"",
  rangoHasta:"",
  comDefPct:6,
  showForm:false,
  editId:null,
  delId:null,
  exportMsg:"",
  xlTab:"detalle",
  form:{fecha:hoyChile(),cliente:"",producto:PRODUCTOS[0],formaPago:FORMAS_PAGO[0],montoBase:"",comision:"6",factura:false}
};

// Filtro combinado: mes (dropdown existente) + rango de fechas Desde/Hasta (afecta pantalla, PDF, Excel y CSV)
function getFiltradas() {
  var list = state.filtroMes ? state.ventas.filter(function(v){ return v.fecha.slice(0,7)===state.filtroMes; }) : state.ventas;
  if (state.rangoDesde) list = list.filter(function(v){ return v.fecha >= state.rangoDesde; });
  if (state.rangoHasta) list = list.filter(function(v){ return v.fecha <= state.rangoHasta; });
  return list;
}
function rangoActivo() { return !!(state.rangoDesde || state.rangoHasta); }
function limpiarRango() { setState({rangoDesde:"", rangoHasta:""}); }

// ============================================================
// ESTADO - funciones
// ============================================================
function setState(p) {
  Object.assign(state, p);
  if (p.ventas !== undefined || p.comDefPct !== undefined) guardarDatos();
  render();
}

function updateForm(k, v) {
  state.form[k] = v;
  if (k==="montoBase" || k==="comision") updatePreview();
  else render();
}

function updatePreview() {
  var base = +state.form.montoBase || 0;
  var pct  = +state.form.comision  || state.comDefPct;
  var esWP = state.form.formaPago === WEBPAY;
  var wp   = esWP ? comWP(base, state.form.formaPago) : 0;
  var co   = base ? comF(base, pct) : 0;
  var box  = document.getElementById("form-com-box");
  if (!box) return;
  if (!base) { box.style.display="none"; return; }
  box.style.display = "block";
  var bV  = document.getElementById("fcb-venta");
  var bC  = document.getElementById("fcb-com");
  var bWP = document.getElementById("fcb-wp");
  if (bV)  bV.textContent  = fmt(base);
  if (bC)  bC.textContent  = fmt(co)+" ("+pct+"%)";
  if (bWP) { bWP.textContent = esWP ? fmt(wp)+" (2%)" : "No aplica"; bWP.style.color = esWP ? "#5EEAD4" : "#555"; }
}

// ============================================================
// RENDER
// ============================================================
function render() {
  var s         = state;
  var filtradas = getFiltradas();
  var meses0    = s.ventas.map(function(v){ return v.fecha.slice(0,7); });
  
  var mesesFijos= [
    "2025-10","2025-11","2025-12",
    "2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09","2026-10","2026-11","2026-12"
  ];
  
  var mesesSet   = {};
  meses0.concat(mesesFijos).forEach(function(m){ mesesSet[m]=1; });
  var meses     = Object.keys(mesesSet).sort().reverse();
  var tV  = filtradas.reduce(function(s,v){ return s+v.montoBase; }, 0);
  var tC  = filtradas.reduce(function(s,v){ return s+comF(v.montoBase,v.comision); }, 0);
  var tFact = filtradas.filter(function(v){ return v.factura; }).length;

  var html = buildTopBar(s.tab) +
    buildBanner(s.comDefPct) +
    buildKpiStrip(filtradas, tV, tC, s.comDefPct, s.filtroMes, meses) +
    (s.exportMsg ? '<div class="msg">'+s.exportMsg+'</div>' : '') +
    (s.tab==='ventas' && filtradas.length>0 ? buildTotalBox(tV, tC, s.comDefPct, filtradas.length, tFact) : '') +
    '<div class="content" style="margin-top:14px">' +
      (s.tab==='ventas'  ? buildTabla(filtradas, s.comDefPct)  : '') +
      (s.tab==='resumen' ? buildResumen(filtradas, s.comDefPct) : '') +
      (s.tab==='config'  ? buildConfig(s.comDefPct)             : '') +
      (s.tab==='calc'    ? buildCalc()                          : '') +
      (s.tab==='vpdf'    ? buildVistaPDF(filtradas, s.comDefPct): '') +
      (s.tab==='vexcel'  ? buildVistaExcel(filtradas,s.comDefPct,s.xlTab): '') +
    '</div>' +
    (s.showForm ? buildForm(s.form, s.editId, s.comDefPct) : '') +
    (s.delId    ? buildDel() : '');

  document.getElementById("app").innerHTML = html;
}

    var cls = tab===t[0] ? 'tab on' : 'tab';
    return '<button class="'+cls+'" data-tab="'+t[0]+'" onclick="goTab(this)">'+t[1]+'</button>';
  }).join('');
  return '<div class="topbar"><div class="brand"><div class="brand-tag">Ventas</div><div class="brand-name">Creamos <span>Imagen</span></div></div><div class="tabs">'+tabHtml+'</div></div>';

  return '<div class="kpi-strip"><div class="kpis">'+kHtml+'</div><div class="actions">'+
    '<select class="month-sel" onchange="setState({filtroMes:this.value})"><option value="" '+(filtroMes?'':'selected')+'>Todos los meses</option>'+optHtml+'</select>'+

// ============================================================
// TABLA REGISTRO (agrupada por dia)
// ============================================================
function buildTabla(filt, cp) {
  if (!filt.length) return '<div class="empty"><div style="font-size:36px;margin-bottom:10px">No hay ventas para este periodo.</div></div>';
  var sorted = filt.slice().sort(function(a,b){ return b.fecha.localeCompare(a.fecha); });
  var tV = sorted.reduce(function(s,v){ return s+v.montoBase; },0);
  var tC = sorted.reduce(function(s,v){ return s+comF(v.montoBase,v.comision); },0);

  var porDia = {};
  sorted.forEach(function(v){ if(!porDia[v.fecha]) porDia[v.fecha]=[]; porDia[v.fecha].push(v); });

  var tbody = Object.keys(porDia).sort().reverse().map(function(dia) {
    var vv = porDia[dia];
    var dV = vv.reduce(function(s,v){ return s+v.montoBase; },0);
    var dC = vv.reduce(function(s,v){ return s+comF(v.montoBase,v.comision); },0);
    var hdr = '<tr class="day-hdr"><td colspan="4"><span style="font-size:13px;font-weight:700;color:#fff">'+fDate(dia)+'</span> <span style="font-size:10px;color:#666;margin-left:8px">'+vv.length+' venta'+(vv.length!==1?'s':'')+'</span></td>'+
      '<td style="padding:9px 12px;text-align:right;font-size:13px;font-weight:800;color:#86EFAC;background:#1C1917">'+fmt(dV)+'</td>'+
      '<td style="padding:9px 12px;text-align:right;font-size:12px;font-weight:700;color:#C8973A;background:#1C1917">'+fmt(dC)+'</td>'+
      '<td colspan="2" style="background:#1C1917"></td></tr>';
    var rows = vv.map(function(v) {
      var pc  = PC[v.formaPago]||{bg:"#f5f5f5",txt:"#555"};
      var co  = comF(v.montoBase, v.comision);
      return '<tr class="row-tr"><td style="padding:8px 12px;font-size:11px;color:var(--muted);padding-left:24px">&#8627;</td>'+
        '<td style="padding:8px 12px;font-weight:600;font-size:13px">'+v.cliente+'</td>'+
        '<td style="padding:8px 12px"><span class="tag">'+v.producto+'</span></td>'+
        '<td style="padding:8px 12px"><span class="pill" style="background:'+pc.bg+';color:'+pc.txt+'">'+v.formaPago+'</span></td>'+
        '<td style="padding:8px 12px;text-align:right;font-size:13px;font-weight:600">'+fmt(v.montoBase)+'</td>'+
        '<td style="padding:8px 12px;text-align:right;font-size:12px;font-weight:600;color:var(--gold)">'+fmt(co)+'</td>'+
        '<td style="padding:8px 12px;text-align:center">'+(v.factura?'<span class="pill" style="background:#F3E8FF;color:#6D28D9">Factura</span>':'<span style="color:#ddd">-</span>')+'</td>'+
        '<td style="padding:8px 7px;white-space:nowrap"><div style="display:flex;gap:4px">'+
          '<button class="act-btn" style="padding:4px 7px;font-size:11px" onclick="openEdit('+v.id+')">Editar</button>'+
          '<button class="act-btn" style="padding:4px 7px;font-size:11px;color:var(--red);border-color:#FECACA" onclick="setState({delId:'+v.id+'})">X</button>'+
        '</div></td></tr>';
    }).join('');
    return hdr + rows;
  }).join('');

  return '<div class="tbl-wrap"><table>'+
    '<thead><tr><th></th><th>Cliente</th><th>Producto</th><th>Forma Pago</th><th style="text-align:right">Venta</th><th style="text-align:right">Comision ('+cp+'%)</th><th>Factura</th><th></th></tr></thead>'+
    '<tbody>'+tbody+'</tbody>'+
    '<tfoot><tr><td colspan="4" style="padding:11px 12px;font-size:9px;font-weight:700;color:#666;text-transform:uppercase">TOTAL - '+filt.length+' ventas</td>'+
      '<td style="padding:11px 12px;text-align:right;color:#86EFAC;font-size:14px;font-weight:800">'+fmt(tV)+'</td>'+
      '<td style="padding:11px 12px;text-align:right;color:#C8973A;font-size:14px;font-weight:800">'+fmt(tC)+'</td>'+
      '<td colspan="2"></td></tr></tfoot>'+
    '</table></div>';
}

// ============================================================
// RESUMEN POR MES
// ============================================================
function buildResumen(filt, cp) {
  if (!filt.length) return '<div class="empty">Sin datos para este periodo.</div>';
  var porMes = {};
  filt.forEach(function(v){
    var m = v.fecha.slice(0,7);
    if(!porMes[m]) porMes[m]={ventas:0,venta:0,comision:0};
    porMes[m].ventas++; porMes[m].venta+=v.montoBase; porMes[m].comision+=comF(v.montoBase,v.comision);
  });
  var tV = filt.reduce(function(s,v){return s+v.montoBase;},0);
  var tC = filt.reduce(function(s,v){return s+comF(v.montoBase,v.comision);},0);
  var cards = [
    {l:"Total Ventas",v:""+filt.length,c:"#1E40AF"},
    {l:"Monto Ventas",v:fmt(tV),c:"#166534"},
    {l:"Total Comision",v:fmt(tC),c:"#C8973A"}
  ].map(function(k){
    return '<div class="kpi-card"><div class="lbl">'+k.l+'</div><div class="val" style="color:'+k.c+'">'+k.v+'</div></div>';
  }).join('');
  var rows = Object.keys(porMes).sort().reverse().map(function(m){
    var d = porMes[m];
    var label = new Date(m+'-01T12:00').toLocaleDateString('es-CO',{month:'long',year:'numeric'});
    label = label.charAt(0).toUpperCase()+label.slice(1);
    var pct = tV>0 ? Math.round(d.venta/tV*100) : 0;
    return '<tr style="border-bottom:1px solid #F4F1EB">'+
      '<td style="padding:14px 16px"><div style="font-size:14px;font-weight:700">'+label+'</div>'+
      '<div style="margin-top:6px;height:4px;background:#F0EAE0;border-radius:4px;max-width:200px">'+
      '<div style="height:100%;width:'+pct+'%;background:var(--gold);border-radius:4px"></div></div></td>'+
      '<td style="padding:14px 16px;text-align:center"><span style="background:#EFF6FF;color:#1E40AF;padding:4px 14px;border-radius:20px;font-size:14px;font-weight:700">'+d.ventas+'</span></td>'+
      '<td style="padding:14px 16px;text-align:right;font-size:16px;font-weight:700;color:#166534">'+fmt(d.venta)+'</td>'+
      '<td style="padding:14px 16px;text-align:right;font-size:16px;font-weight:700;color:var(--gold)">'+fmt(d.comision)+'</td></tr>';
  }).join('');
  return '<div class="fade"><div class="kpi-cards">'+cards+'</div>'+
    '<div class="tbl-wrap"><table>'+
    '<thead><tr><th>Mes / Ano</th><th style="text-align:center">N Ventas</th><th style="text-align:right">Venta</th><th style="text-align:right">Total Comision</th></tr></thead>'+
    '<tbody>'+rows+'</tbody>'+

    '<td style="padding:11px 16px;text-align:center;font-size:15px;font-weight:800;color:#93C5FD">'+filt.length+'</td>'+
    '<td style="padding:11px 16px;text-align:right;font-size:16px;font-weight:800;color:#86EFAC">'+fmt(tV)+'</td>'+
    '<td style="padding:11px 16px;text-align:right;font-size:16px;font-weight:800;color:#C8973A">'+fmt(tC)+'</td></tr></tfoot>'+
    '</table></div></div>';
}

function buildCalc() {
  var btns = [
    {l:"C",s:"background:#DC2626;color:#fff;border-color:transparent"},{l:"+-",s:"background:#374151;color:#fff;border-color:transparent"},
    {l:"%",s:"background:#374151;color:#fff;border-color:transparent"},{l:"/",s:"background:var(--gold);color:#fff;border-color:transparent"},
    {l:"7",s:""},{l:"8",s:""},{l:"9",s:""},{l:"x",s:"background:var(--gold);color:#fff;border-color:transparent"},
    {l:"4",s:""},{l:"5",s:""},{l:"6",s:""},{l:"-",s:"background:var(--gold);color:#fff;border-color:transparent"},
    {l:"1",s:""},{l:"2",s:""},{l:"3",s:""},{l:"+",s:"background:var(--gold);color:#fff;border-color:transparent"},
    {l:"0",s:"grid-column:span 2"},{l:".",s:""},{l:"=",s:"background:var(--teal);color:#fff;border-color:transparent"}
  ];
  var bHtml = btns.map(function(b){
    return '<button data-btn="'+b.l+'" onclick="doCalc(this)" style="'+b.s+';border:1.5px solid var(--border);border-radius:10px;padding:14px 8px;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit">'+b.l+'</button>';
  }).join('');
  return '<div class="fade" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:900px">'+
    '<div style="background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden">'+
    '<div style="background:var(--dark);padding:14px 18px"><div style="font-size:9px;color:var(--gold);letter-spacing:.15em;font-weight:700;text-transform:uppercase;margin-bottom:2px">Herramienta</div><div style="font-size:17px;font-weight:800;color:#fff">Calculadora</div></div>'+
    '<div style="padding:16px">'+
    '<div style="background:#1C1917;border-radius:10px;padding:14px 18px;margin-bottom:12px;text-align:right">'+
    '<div id="calc-expr" style="font-size:11px;color:#666;min-height:16px;margin-bottom:4px"></div>'+
    '<div id="calc-display" style="font-size:28px;font-weight:800;color:#fff">0</div></div>'+

function openForm() {
  state.form = {fecha:hoyChile(),cliente:"",producto:PRODUCTOS[0],formaPago:FORMAS_PAGO[0],montoBase:"",comision:""+state.comDefPct,factura:false};
  setState({showForm:true, editId:null});
}

function openEdit(id) {
  var v = state.ventas.find(function(x){return x.id===id;});
  state.form = {fecha:v.fecha,cliente:v.cliente,producto:v.producto,formaPago:v.formaPago,montoBase:""+v.montoBase,comision:""+v.comision,factura:v.factura};
  setState({showForm:true, editId:id});
}

function submitForm() {
  var ci = document.getElementById('f-cliente');
  var mi = document.getElementById('f-monto');
  var coi= document.getElementById('f-com');
  if (ci)  state.form.cliente   = ci.value;
  if (mi)  state.form.montoBase = mi.value;
  if (coi) state.form.comision  = coi.value;
  var f = state.form;
  if (!f.fecha || !f.cliente || !f.montoBase) return;
  var entry = {
    id:        state.editId || Date.now(),
    fecha:     f.fecha,
    cliente:   f.cliente,
    producto:  f.producto,
    formaPago: f.formaPago,
    montoBase: +f.montoBase,
    comision:  +f.comision || state.comDefPct,
    factura:   f.factura
  };
  if (state.editId) {
    state.ventas = state.ventas.map(function(x){ return x.id===state.editId ? entry : x; });
  } else {
    state.ventas = state.ventas.concat([entry]);
  }
  guardarDatos();
  setState({showForm:false, editId:null});
}

function confirmDel() {
  state.ventas = state.ventas.filter(function(x){ return x.id !== state.delId; });
  guardarDatos();
  setState({delId:null});
}

// ============================================================
// CALCULADORAS
// ============================================================
var calcState = {display:"0", expr:"", prev:null, op:null, reset:false};

function calcBtn(btn) {
  var s = calcState;
  var d = document.getElementById("calc-display");
  var e = document.getElementById("calc-expr");
  if (!d) return;
  if (btn==="C") {
    s.display="0"; s.expr=""; s.prev=null; s.op=null; s.reset=false;
  } else if (btn==="+-") {
    s.display = s.display==="0" ? "0" : ""+(-parseFloat(s.display));
  } else if (btn==="%") {
    s.display = ""+(parseFloat(s.display)/100);
  } else if (btn==="/" || btn==="x" || btn==="-" || btn==="+") {
    s.prev = parseFloat(s.display); s.op = btn;
    s.expr = s.display+" "+btn; s.reset = true;
  } else if (btn==="=") {
    if (s.op && s.prev !== null) {
      var cur = parseFloat(s.display);
      var res;
      if (s.op==="/") res = cur===0 ? "Error" : s.prev/cur;
      else if (s.op==="x") res = s.prev*cur;
      else if (s.op==="-") res = s.prev-cur;
      else res = s.prev+cur;
      s.expr = s.expr+" "+s.display+" =";
      s.display = res==="Error" ? "Error" : ""+parseFloat(res.toFixed(10));
      s.op=null; s.prev=null; s.reset=true;
    }
  } else if (btn===".") {
    if (s.reset) { s.display="0."; s.reset=false; }
    else if (s.display.indexOf(".")===-1) s.display+=".";
  } else {
    if (s.reset || s.display==="0") { s.display=btn; s.reset=false; }
    else if (s.display.length<15) s.display+=btn;
  }
  var num = parseFloat(s.display);
  var disp = s.display==="Error" ? "Error"
    : isNaN(num) ? s.display
    : s.display.slice(-1)==="." ? num.toLocaleString("es-CO")+"."
    : s.display.indexOf(".")!==-1 ? num.toLocaleString("es-CO",{minimumFractionDigits:s.display.split(".")[1].length})
    : num.toLocaleString("es-CO");
  d.textContent = disp;
  if (e) e.textContent = s.expr;
}

function calcBN() {
  var v  = +document.getElementById("inp-bruto").value;
  var rn = document.getElementById("res-neto");
  var dd = document.getElementById("det-bruto");
  if (!v || isNaN(v)) { rn.textContent="-"; if(dd) dd.style.display="none"; return; }
  var neto = Math.round(v/1.19);
  var iva  = v - neto;
  rn.textContent = fmt(neto);
  if (dd) { dd.innerHTML = "IVA incluido: <strong>"+fmt(iva)+"</strong> Neto: <strong>"+fmt(neto)+"</strong>"; dd.style.display="block"; }
}

function calcNB() {
  var v  = +document.getElementById("inp-neto").value;
  var rb = document.getElementById("res-bruto");
  var dd = document.getElementById("det-neto");
  if (!v || isNaN(v)) { rb.textContent="-"; if(dd) dd.style.display="none"; return; }
  var bruto = Math.round(v*1.19);
  var iva   = bruto - v;
  rb.textContent = fmt(bruto);
  if (dd) { dd.innerHTML = "Neto: <strong>"+fmt(v)+"</strong> + IVA: <strong>"+fmt(iva)+"</strong>"; dd.style.display="block"; }
}

function calcComAuto() {
  var monto  = +document.getElementById("cc-monto").value;
  var pct    = +document.getElementById("cc-pct").value;
  var tot    = document.getElementById("cc-total");
  var det    = document.getElementById("cc-detalle");
  var base   = document.getElementById("cc-base");
  var com    = document.getElementById("cc-com");
  var tot2   = document.getElementById("cc-tot2");
  if (!monto || isNaN(monto) || isNaN(pct)) { if(tot) tot.textContent="-"; if(det) det.style.display="none"; return; }
  var comVal   = Math.round(monto*pct/100);
  var totalVal = monto + comVal;
  if (tot)  tot.textContent  = fmt(totalVal);
  if (base) base.textContent = fmt(monto);
  if (com)  com.textContent  = fmt(comVal);
  if (tot2) tot2.textContent = fmt(totalVal);
  if (det)  det.style.display = "block";
}

// ============================================================
// INICIO Y SINCRONIZACIÓN
// ============================================================
async function initApp() {
  try {
    const cloudData = await loadFromCloudSharded();
    // Carga confirmada (con datos o genuinamente vacía): ya se puede guardar
    // en la nube con seguridad.
    cargaVentasOk = true;
    if (cloudData) {
      var ventasNube = cloudData.ventas || [];
      // Antes de reemplazar la copia local con la de la nube, se rescatan las
      // ventas que están en este equipo y nunca llegaron a la nube (así se
      // perdían las ventas cuando una subida fallaba y luego se recargaba).
      // Si este equipo ya las había visto en la nube (idsPrevios), es que
      // otro equipo las borró: esas no se ofrecen.
      var idsPrevios = leerIdsNube();
      var idsNube = new Set(ventasNube.map(function(v){ return v.id; }));
      var ventasLocales = [];
      try { var rawLocal = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); if (rawLocal && Array.isArray(rawLocal.ventas)) ventasLocales = rawLocal.ventas; } catch(e) {}
      var noSubidas = ventasLocales.filter(function(v){
        return v && v.id && !idsNube.has(v.id) && !(idsPrevios && idsPrevios.has(v.id));
      });

      state.ventas = ventasNube;
      if (cloudData.comDefPct) state.comDefPct = cloudData.comDefPct;
      if (cloudData.filtroMes !== undefined) state.filtroMes = cloudData.filtroMes;
      recordarIdsNube(ventasNube);

      if (noSubidas.length > 0) {
        var detalle = noSubidas.slice().sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1; }).slice(0, 15).map(function(v){
          return '• ' + v.fecha + '  ' + v.cliente + '  ' + fmt(v.montoBase);
        }).join('\n') + (noSubidas.length > 15 ? '\n… y ' + (noSubidas.length - 15) + ' más' : '');
        var subir = confirm('Este equipo tiene ' + noSubidas.length + ' venta(s) que NO están en la nube (no se alcanzaron a subir):\n\n' + detalle +
          '\n\n¿Subirlas ahora a la nube?\n\nAceptar = subirlas.\nCancelar = no subirlas (quedan respaldadas en este equipo).');
        if (subir) {
          state.ventas = ventasNube.concat(noSubidas);
          guardarDatos(); // fusiona con la nube y sube
        } else {
          // Respaldo aparte, para que no se pierdan al sobrescribir la copia local.
          try {
            var previas = JSON.parse(localStorage.getItem(NO_SUBIDAS_KEY) || '[]');
            localStorage.setItem(NO_SUBIDAS_KEY, JSON.stringify(previas.concat(noSubidas)));
          } catch(e) {}
        }
      }
      // Se sincroniza localStorage con lo que quedó (sin volver a subir si no
      // hubo nada que rescatar: evita el bug que sobreescribía la nube en cada carga).
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ventas: state.ventas, comDefPct: state.comDefPct, filtroMes: state.filtroMes }));
      } catch(e) {}
    } else {
      // La nube respondió pero no hay nada guardado todavía: se usa el
      // respaldo local si existe, y recién ahí (con carga ya confirmada) se
      // sube para inicializar la nube.
      cargarDatos();
      guardarDatos();
    }
  } catch (e) {
    // No se pudo confirmar el estado de la nube (red, HTTP o error del
    // servidor). cargaVentasOk queda en false: se usa el respaldo local para
    // no dejar la pantalla vacía, pero NO se sube nada, para no arriesgarse a
    // borrar datos reales que sí están en la nube.
    console.error("No se pudo cargar desde la nube; usando respaldo local sin sincronizar.", e);
    cargarDatos();
    alert("No se pudo confirmar la conexión con la nube al abrir esta página. Se muestran los datos guardados en este dispositivo. Para evitar perder ventas ya registradas, recarga la página (F5) antes de agregar o editar ventas.");
  }
  render();
}

initApp().finally(ocultarCargando);
