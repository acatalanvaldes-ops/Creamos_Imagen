<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Actualizar Creamos Imagen</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#1f2937;font:16px Arial,sans-serif}
    main{box-sizing:border-box;width:min(92vw,480px);padding:32px;border-radius:16px;background:#fff;text-align:center}
    h1{font-size:22px}p{color:#64748b;line-height:1.5}
  </style>
</head>
<body>
  <main>
    <h1>Actualizando Creamos Imagen</h1>
    <p id="estado">Limpiando la copia guardada en este dispositivo…</p>
  </main>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
        }
        document.getElementById('estado').textContent = 'Listo. Abriendo el portal actualizado…';
        setTimeout(() => location.replace('/?actualizado=20260925'), 500);
      } catch (error) {
        document.getElementById('estado').textContent = 'No se pudo limpiar automáticamente. Cierra la aplicación y vuelve a abrirla desde el navegador.';
        console.error('Error actualizando Creamos Imagen:', error);
      }
    })();
  </script>
</body>
</html>
