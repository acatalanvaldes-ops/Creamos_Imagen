<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // El inicio de sesión del portal vive en portal.html. Microsoft vuelve a
  // index.html (dirección registrada en Azure) y los enlaces antiguos de
  // "volver a iniciar sesión" también: se reenvían al portal.
  (function () {
    var q = location.search;
    if (/[?&](code|error|reauth|return)=/.test(q)) location.replace("portal.html" + q + location.hash);
  })();
</script>
<title>Creamos Imagen · Sublimación y vestuario deportivo</title>
<meta name="description" content="Creamos Imagen: camisetas y conjuntos deportivos sublimados, línea K-pop y artículos personalizados. Tienda en Recoleta, Santiago.">
<meta name="theme-color" content="#141414">
<meta property="og:title" content="Creamos Imagen · Sublimación y vestuario deportivo">
<meta property="og:description" content="Camisetas y conjuntos deportivos sublimados, línea K-pop y artículos personalizados. Tienda en Recoleta, Santiago.">
<meta property="og:image" content="https://creamosimagen.vercel.app/brand/app-icon-512.png">
<link rel="icon" href="brand/app-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#141414;--oro:#F1AF13;--crema:#F7F6F2;--blanco:#fff;
  --salvia:#BCD0CA;--terracota:#DA8C68;--gris:#6F6B63;--borde:#E6E2D9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',Arial,sans-serif;background:var(--crema);color:var(--negro);line-height:1.55}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
#contenido{transition:opacity .25s}
#contenido.cargando{opacity:0}

/* Aviso / promoción */
.aviso{background:var(--oro);color:var(--negro);text-align:center;font-weight:700;font-size:14px;padding:9px 16px}

/* Encabezado */
header{position:sticky;top:0;z-index:20;background:var(--negro);border-bottom:3px solid var(--oro)}
.nav{display:flex;align-items:center;gap:24px;height:68px;position:relative}
.nav .logo img{height:40px;width:auto}
.nav ul{display:flex;gap:22px;list-style:none;margin-left:auto}
.nav ul a{color:#ddd;text-decoration:none;font-size:15px;font-weight:500}
.nav ul a:hover{color:var(--oro)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:2px solid transparent;transition:transform .15s,filter .15s;cursor:pointer}
.btn:hover{transform:translateY(-1px);filter:brightness(.96)}
.btn-oro{background:var(--oro);color:var(--negro)}
.btn-borde{border-color:var(--oro);color:var(--oro)}
.menu-movil{display:none;background:none;border:0;color:#fff;font-size:26px;cursor:pointer}

/* Portada */
.hero{background:var(--negro);color:var(--blanco);padding:80px 0 90px;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-120px;top:-80px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,var(--oro) 0%,transparent 65%);opacity:.18}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center;position:relative;z-index:1}
.etiqueta{display:inline-block;color:var(--oro);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.hero h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(38px,5.5vw,62px);line-height:1.05;margin-bottom:20px}
.hero h1 em{color:var(--oro);font-style:normal}
.hero p{color:#cfcfcf;font-size:18px;max-width:520px;margin-bottom:30px}
.acciones{display:flex;gap:12px;flex-wrap:wrap}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dato{background:#1f1f1f;border:1px solid #2c2c2c;border-radius:16px;padding:22px}
.dato b{display:block;font-family:'DM Serif Display',serif;font-weight:400;font-size:38px;color:var(--oro);line-height:1}
.dato span{color:#bbb;font-size:14px}

/* Secciones */
section{padding:80px 0}
.titulo{margin-bottom:36px}
.titulo h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(30px,4vw,42px);line-height:1.1}
.titulo p{color:var(--gris);margin-top:8px;max-width:600px}

/* Filtros y catálogo */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.filtros button{font:inherit;font-size:14px;font-weight:500;padding:8px 16px;border-radius:999px;border:1px solid var(--borde);background:var(--blanco);cursor:pointer}
.filtros button.on{background:var(--negro);color:var(--oro);border-color:var(--negro)}
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.producto{background:var(--blanco);border:1px solid var(--borde);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.producto:hover{box-shadow:0 14px 30px rgba(20,20,20,.08);transform:translateY(-3px)}
.foto{aspect-ratio:4/3;display:grid;place-items:center;position:relative;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.foto.galeria{cursor:pointer;background:#fff}
.foto.galeria img{position:absolute;inset:0;opacity:0;transition:opacity .35s;object-fit:contain}
.foto.galeria img.on{opacity:1}
.puntos{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.puntos i{width:7px;height:7px;border-radius:50%;background:rgba(20,20,20,.25)}
.puntos i.on{background:var(--negro)}
.foto .marca{font-family:'DM Serif Display',serif;font-size:30px;color:rgba(20,20,20,.75)}
.foto .cat{position:absolute;top:12px;left:12px;background:var(--negro);color:var(--oro);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.info{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h3{font-size:18px}
.info p{color:var(--gris);font-size:14px;flex:1}
.info .pie{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.precio{font-weight:700}
.info a{font-size:14px;font-weight:700;color:var(--negro);text-decoration:none;border-bottom:2px solid var(--oro)}

/* Cómo comprar */
.comprar{background:var(--blanco);border-top:1px solid var(--borde);border-bottom:1px solid var(--borde)}
.pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;counter-reset:paso}
.paso{padding:24px;border-radius:16px;background:var(--crema);counter-increment:paso}
.paso::before{content:counter(paso,decimal-leading-zero);display:block;font-family:'DM Serif Display',serif;font-size:34px;color:var(--oro);margin-bottom:10px}
.paso h3{font-size:17px;margin-bottom:6px}
.paso p{color:var(--gris);font-size:14px}
.pago{margin-top:28px;color:var(--gris);font-size:15px}

/* Tienda y contacto */
.contacto .wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:stretch}
.tarjeta{background:var(--negro);color:var(--blanco);border-radius:22px;padding:36px}
.tarjeta h3{font-family:'DM Serif Display',serif;font-weight:400;font-size:30px;margin-bottom:14px}
.tarjeta p{color:#ccc;margin-bottom:10px}
.tarjeta .acciones{margin-top:22px}
.mapa{border-radius:22px;overflow:hidden;border:1px solid var(--borde);min-height:320px;background:var(--salvia)}
.mapa iframe{width:100%;height:100%;min-height:320px;border:0}

/* Pie */
footer{background:var(--negro);color:#aaa;padding:36px 0;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer img{height:34px;width:auto}
footer a{color:var(--oro)}

@media (max-width:860px){
  .hero .wrap,.contacto .wrap{grid-template-columns:1fr}
  .nav ul{display:none;position:absolute;top:71px;left:-20px;right:-20px;flex-direction:column;gap:0;background:var(--negro);padding:8px 20px 16px}
  .nav ul.abierto{display:flex}
  .nav ul a{display:block;padding:12px 0}
  .menu-movil{display:block;margin-left:auto}
}
@media (max-width:520px){
  .datos{grid-template-columns:1fr}
  .nav .ingresar span{display:none}
  section{padding:60px 0}
  .hero{padding:56px 0 64px}
}
</style>
</head>
<body>

<div class="aviso" id="aviso" hidden></div>

<header>
  <nav class="wrap nav">
    <a class="logo" href="#inicio"><img src="brand/logo-horizontal-white.svg" alt="Creamos Imagen"></a>
    <ul id="menu">
      <li><a href="#productos">Productos</a></li>
      <li><a href="#como-comprar">Cómo comprar</a></li>
      <li><a href="#contacto">Tienda y contacto</a></li>
    </ul>
    <button class="menu-movil" id="btn-menu" aria-label="Abrir menú">☰</button>
    <a class="btn btn-borde ingresar" href="portal.html">🔒 <span>Ingresar</span></a>
  </nav>
</header>

<main id="inicio">
<div id="contenido" class="cargando">
  <section class="hero">
    <div class="wrap">
      <div>
        <span class="etiqueta" id="h-etiqueta"></span>
        <h1><span id="h-titulo"></span> <em id="h-destacado"></em></h1>
        <p id="h-bajada"></p>
        <div class="acciones">
          <a class="btn btn-oro" href="#productos" id="h-b1"></a>
          <a class="btn btn-borde" id="h-b2" href="#contacto"></a>
        </div>
      </div>
      <div class="datos" id="datos"></div>
    </div>
  </section>

  <section id="productos">
    <div class="wrap">
      <div class="titulo">
        <span class="etiqueta" id="c-etiqueta"></span>
        <h2 id="c-titulo"></h2>
        <p id="c-bajada"></p>
      </div>
      <div class="filtros" id="filtros"></div>
      <div class="grilla" id="grilla"></div>
    </div>
  </section>

  <section class="comprar" id="como-comprar">
    <div class="wrap">
      <div class="titulo">
        <span class="etiqueta" id="p-etiqueta"></span>
        <h2 id="p-titulo"></h2>
      </div>
      <div class="pasos" id="pasos"></div>
      <p class="pago" id="p-pago"></p>
    </div>
  </section>

  <section class="contacto" id="contacto">
    <div class="wrap">
      <div class="tarjeta">
        <span class="etiqueta">Tienda física</span>
        <h3 id="t-titulo"></h3>
        <p id="t-direccion"></p>
        <p id="t-horario"></p>
        <p id="t-correo"></p>
        <div class="acciones" id="redes"></div>
      </div>
      <div class="mapa">
        <iframe id="mapa" title="Mapa de la tienda" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </section>
</div>
</main>

<footer>
  <div class="wrap">
    <img src="brand/logo-horizontal-white.svg" alt="Creamos Imagen">
    <span>© <span id="anio"></span> Creamos Imagen · <span id="f-direccion"></span></span>
    <span><a href="privacidad.html">Privacidad</a> · <a href="portal.html">Acceso trabajadores →</a></span>
  </div>
</footer>

<script src="sitio-contenido.js"></script>
<script>
const { esc, colorSeguro, urlSegura, fotosDe, soloDigitos } = SitioUtil;
const $ = s => document.querySelector(s);
let S = contenidoSitio(null);
let filtro = "Todos";

const linkWsp = msg => soloDigitos(S.contacto.whatsapp)
  ? "https://wa.me/" + soloDigitos(S.contacto.whatsapp) + "?text=" + encodeURIComponent(msg)
  : "#contacto";
const abreFuera = () => soloDigitos(S.contacto.whatsapp) ? ' target="_blank" rel="noopener"' : "";
const texto = (sel, t) => { const el = $(sel); if (el) el.textContent = t || ""; };

function pintar() {
  const a = S.aviso || {};
  $("#aviso").hidden = !(a.activo && a.texto);
  texto("#aviso", a.texto);

  const p = S.portada;
  texto("#h-etiqueta", p.etiqueta); texto("#h-titulo", p.titulo); texto("#h-destacado", p.destacado);
  texto("#h-bajada", p.bajada); texto("#h-b1", p.botonPrincipal); texto("#h-b2", p.botonSecundario);
  const b2 = $("#h-b2");
  b2.href = linkWsp(S.contacto.mensajeWhatsapp);
  if (soloDigitos(S.contacto.whatsapp)) { b2.target = "_blank"; b2.rel = "noopener"; } else { b2.removeAttribute("target"); }

  $("#datos").innerHTML = (S.datos || []).filter(d => d.valor || d.texto).slice(0, 6)
    .map(d => `<div class="dato"><b>${esc(d.valor)}</b><span>${esc(d.texto)}</span></div>`).join("");

  texto("#c-etiqueta", S.catalogo.etiqueta); texto("#c-titulo", S.catalogo.titulo); texto("#c-bajada", S.catalogo.bajada);
  pintarFiltros(); pintarProductos();

  texto("#p-etiqueta", S.comprar.etiqueta); texto("#p-titulo", S.comprar.titulo); texto("#p-pago", S.comprar.pago);
  $("#pasos").innerHTML = (S.comprar.pasos || []).filter(x => x.titulo || x.texto)
    .map(x => `<div class="paso"><h3>${esc(x.titulo)}</h3><p>${esc(x.texto)}</p></div>`).join("");

  const c = S.contacto;
  texto("#t-titulo", c.titulo);
  texto("#t-direccion", c.direccion ? "📍 " + c.direccion : "");
  texto("#t-horario", c.horario ? "🕒 " + c.horario : "");
  texto("#t-correo", c.correo ? "✉️ " + c.correo : "");
  texto("#f-direccion", c.direccion);
  const redes = [];
  if (soloDigitos(c.whatsapp)) redes.push(`<a class="btn btn-oro" target="_blank" rel="noopener" href="${esc(linkWsp(c.mensajeWhatsapp))}">WhatsApp</a>`);
  [["Instagram", c.instagram], ["TikTok", c.tiktok], ["Facebook", c.facebook]].forEach(([n, u]) => {
    if (urlSegura(u)) redes.push(`<a class="btn btn-borde" target="_blank" rel="noopener" href="${esc(urlSegura(u))}">${n}</a>`);
  });
  const destino = encodeURIComponent(c.direccion || "Río de Janeiro 319, Recoleta, Chile");
  redes.push(`<a class="btn btn-borde" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${destino}">Cómo llegar</a>`);
  $("#redes").innerHTML = redes.join("");
  const urlMapa = "https://maps.google.com/maps?q=" + destino + "&z=16&output=embed";
  if ($("#mapa").getAttribute("src") !== urlMapa) $("#mapa").setAttribute("src", urlMapa);
}

function productosVisibles() { return (S.productos || []).filter(p => p.visible !== false && p.nombre); }
function pintarFiltros() {
  const cats = ["Todos", ...new Set(productosVisibles().map(p => p.categoria).filter(Boolean))];
  if (!cats.includes(filtro)) filtro = "Todos";
  $("#filtros").innerHTML = cats.length > 2 ? cats.map(c => `<button class="${c === filtro ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("") : "";
  $("#filtros").querySelectorAll("button").forEach(b => b.onclick = () => { filtro = b.dataset.c; pintarFiltros(); pintarProductos(); });
}
function pintarProductos() {
  const lista = productosVisibles().filter(p => filtro === "Todos" || p.categoria === filtro);
  $("#grilla").innerHTML = lista.map(p => {
    const fotos = fotosDe(p);
    const imagenes = fotos.length > 1
      // Solo la primera foto se descarga al abrir; el resto, al usar el visor.
      ? fotos.map((f, i) => `<img ${i ? "data-src" : "src"}="${esc(f)}" alt="${esc(p.nombre)} · foto ${i + 1}" loading="lazy" class="${i ? "" : "on"}">`).join("") +
        `<span class="puntos">${fotos.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</span>`
      : fotos.length ? `<img src="${esc(fotos[0])}" alt="${esc(p.nombre)}" loading="lazy">` : `<span class="marca">CI</span>`;
    return `
    <article class="producto">
      <div class="foto${fotos.length > 1 ? " galeria" : ""}" style="${fotos.length > 1 ? "" : "background:" + colorSeguro(p.color)}"${fotos.length > 1 ? ' title="Pasa el mouse o toca para ver más fotos"' : ""}>
        ${imagenes}
        ${p.categoria ? `<span class="cat">${esc(p.categoria)}</span>` : ""}
      </div>
      <div class="info">
        <h3>${esc(p.nombre)}</h3>
        <p>${esc(p.texto)}</p>
        <div class="pie">
          <span class="precio">${esc(p.precio || "A cotizar")}</span>
          <a${abreFuera()} href="${esc(linkWsp("Hola, quiero cotizar: " + p.nombre))}">Cotizar →</a>
        </div>
      </div>
    </article>`;
  }).join("");
  $("#grilla").querySelectorAll(".foto.galeria").forEach(activarGaleria);
}

// Visor de varias fotos: al pasar el mouse avanzan solas; al salir vuelve a
// la primera. En pantallas táctiles, cada toque muestra la siguiente.
function activarGaleria(caja) {
  const imgs = [...caja.querySelectorAll("img")], puntos = [...caja.querySelectorAll(".puntos i")];
  let i = 0, timer = null;
  const cargar = () => imgs.forEach(im => { if (im.dataset.src) { im.src = im.dataset.src; im.removeAttribute("data-src"); } });
  caja.addEventListener("mouseenter", cargar, { once: true });
  caja.addEventListener("touchstart", cargar, { once: true, passive: true });
  const ir = n => { i = (n + imgs.length) % imgs.length; imgs.forEach((im, k) => im.classList.toggle("on", k === i)); puntos.forEach((pt, k) => pt.classList.toggle("on", k === i)); };
  if (window.matchMedia("(hover: hover)").matches) {
    caja.addEventListener("mouseenter", () => { clearInterval(timer); ir(i + 1); timer = setInterval(() => ir(i + 1), 1100); });
    caja.addEventListener("mouseleave", () => { clearInterval(timer); timer = null; ir(0); });
  }
  caja.addEventListener("click", () => { cargar(); if (!timer) ir(i + 1); });
}

$("#anio").textContent = new Date().getFullYear();
$("#btn-menu").onclick = () => $("#menu").classList.toggle("abierto");
document.querySelectorAll("#menu a").forEach(a => a.onclick = () => $("#menu").classList.remove("abierto"));

// Contenido editado en el portal (Sitio web). Si no responde a tiempo, se
// muestra el contenido base para no dejar la página en blanco.
pintar();
const mostrar = () => $("#contenido").classList.remove("cargando");
const tope = setTimeout(mostrar, 1800);
fetch("/api/sitio").then(r => r.json()).then(j => {
  if (j && j.estado === "éxito" && j.contenido) { S = contenidoSitio(j.contenido); pintar(); }
}).catch(() => {}).finally(() => { clearTimeout(tope); mostrar(); });
</script>
</body>
</html>
