<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Creamos Imagen</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 24px 0; }
    .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
    h1 { color: #1f2937; font-size: 24px; margin-bottom: 8px; }
    p { color: #6b7280; margin-bottom: 30px; font-size: 14px; }
    .menu-btn { display: block; width: 100%; padding: 14px; margin-bottom: 12px; background-color: #2c5f2e; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.3s; box-sizing: border-box; }
    .menu-btn:hover { background-color: #1b5e20; }
    .menu-btn.alt { background-color: #e8a020; }
    .menu-btn.alt:hover { background-color: #c45c1a; }
    .menu-btn.dark { background-color: #1f2937; }
    .menu-btn.dark:hover { background-color: #111827; }
    .menu-btn.blue { background-color: #1e40af; }
    .menu-btn.blue:hover { background-color: #1e3a8a; }
    .menu-btn.teal { background-color: #0D7A6B; }
    .menu-btn.teal:hover { background-color: #09594D; }
    .menu-btn.purple { background-color: #6D28D9; }
    .menu-btn.purple:hover { background-color: #5B21B6; }
    .menu-btn.brown { background-color: #92400E; }
    .menu-btn.brown:hover { background-color: #78350F; }
    .menu-btn.pink { background-color: #BE185D; }
    .menu-btn.pink:hover { background-color: #9D174D; }
    .menu-btn.maroon { background-color: #991B1B; }
    .menu-btn.maroon:hover { background-color: #7F1D1D; }
  </style>
</head>
<body>
<div id="cimagen-gate" style="position:fixed;inset:0;z-index:999999;background:#111827;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
  <div style="background:#fff;padding:36px 32px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.3);max-width:340px;width:90%;text-align:center;">
    <div style="font-size:32px;margin-bottom:8px;">🔒</div>
    <h2 style="margin:0 0 6px;color:#1f2937;font-size:18px;">Creamos Imagen</h2>
    <p style="margin:0 0 20px;color:#6b7280;font-size:13px;">Ingresa la contraseña para continuar</p>
    <input type="password" id="cimagen-gate-input" placeholder="Contraseña" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;margin-bottom:10px;">
    <div id="cimagen-gate-error" style="color:#dc2626;font-size:12px;min-height:16px;margin-bottom:10px;"></div>
    <button id="cimagen-gate-btn" style="width:100%;padding:11px;background:#2c5f2e;color:#fff;border:none;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;">Entrar</button>
  </div>
</div>
<script>
(function(){
  var PASS = "Cimagen2026";
  var KEY = "cimagen_auth_ok";
  if (localStorage.getItem(KEY) === "1") {
    var g0 = document.getElementById('cimagen-gate');
    if (g0) g0.remove();
  } else {
    document.documentElement.style.overflow = 'hidden';
    window.addEventListener('DOMContentLoaded', function(){
      var input = document.getElementById('cimagen-gate-input');
      var btn = document.getElementById('cimagen-gate-btn');
      var err = document.getElementById('cimagen-gate-error');
      function tryEnter(){
        if (input.value === PASS) {
          localStorage.setItem(KEY, "1");
          document.getElementById('cimagen-gate').remove();
          document.documentElement.style.overflow = '';
        } else {
          err.textContent = "Contraseña incorrecta";
          input.value = "";
          input.focus();
        }
      }
      btn.addEventListener('click', tryEnter);
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryEnter(); });
      setTimeout(function(){ input.focus(); }, 50);
    });
  }
})();
</script>

  <div class="container">
    <h1>Portal Creamos Imagen</h1>
    <p>Selecciona la aplicación a la que deseas ingresar:</p>

    <a href="rendicion.html" class="menu-btn">💵 Caja</a>
    <a href="clientes.html" class="menu-btn purple">👥 Clientes</a>
    <a href="costos.html" class="menu-btn teal">⚙️ Costos</a>
    <a href="cotizaciones.html" class="menu-btn pink">🧾 Cotizaciones</a>
    <a href="dashboard.html" class="menu-btn maroon">📈 Indicadores</a>
    <a href="calendario.html" class="menu-btn alt">📅 Producciones</a>
    <a href="proveedores.html" class="menu-btn brown">📦 Proveedores</a>
    <a href="ventasci.html" class="menu-btn blue">🏢 Ventas Empresa (Creamos Imagen)</a>
    <a href="ventas.html" class="menu-btn dark">📊 Ventas Local (Vendedores)</a>
  </div>
</body>
</html>
