<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosola de Permisos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--surface:#FFFFFF;--dark:#1C1917;--gold:#C8973A;--teal:#0D7A6B;--red:#C0392B;--muted:#78716C;--border:#E7E2D9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh}
.topbar{background:var(--dark);padding:18px 24px;display:flex;align-items:center;justify-content:flex-end}
.brand-tag{font-size:9px;color:var(--gold);letter-spacing:.2em;font-weight:700;text-transform:uppercase;margin-bottom:2px}
.brand-name{font-family:'DM Serif Display',serif;font-size:22px;color:#fff}
.brand-name span{color:var(--gold)}
.content{padding:24px;max-width:1100px;margin:0 auto}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.card-title{font-size:13px;font-weight:700;color:var(--dark);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.help{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5}
.help b{color:var(--dark)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--dark);color:var(--gold);font-size:10px;text-transform:uppercase;padding:8px 6px;text-align:center;white-space:nowrap}
th.email-col{text-align:left;padding-left:12px}
td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:center}
td.email-col{text-align:left;padding-left:12px;font-weight:600}
tr:hover td{background:#FAFAF8}
input[type=checkbox]{width:16px;height:16px;cursor:pointer}
.act-btn{background:#fff;border:1.5px solid var(--border);color:var(--dark);padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.act-btn:hover{border-color:var(--gold);color:var(--gold)}
.act-btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
.act-btn.primary:hover{background:#B8872A}
.icon-btn{background:none;border:none;cursor:pointer;font-size:14px;opacity:.5}
.icon-btn:hover{opacity:1}
.add-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.add-row input[type=email]{flex:1;min-width:220px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--dark)}
.add-row input[type=email]:focus{border-color:var(--gold);background:#fff;outline:none}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.save-badge{position:fixed;bottom:18px;right:18px;background:var(--dark);color:var(--gold);padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.super-note{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:10px 14px;font-size:12px;color:#166534;margin-bottom:16px}
.access-brand-logo{width:155px;height:48px;background:url('brand/logo-horizontal-white.svg') center/contain no-repeat}
</style>
  <link rel="stylesheet" href="brand/brand.css">
  <script src="brand/brand.js"></script>
  <script src="brand/form-examples.js"></script>
  <script src="brand/layout.js"></script>
</head>
<body>
<script src="sesion.js"></script>
<script src="cargando.js"></script>
<script>
(function(){
  var SESSION_KEY = "cimagen_session";
  var SESSION_TTL_MS = 24 * 60 * 60 * 1000;
  var SUPER_ADMIN_EMAIL = "a.catalan.valdes@gmail.com";
  var sess = null;
  try { sess = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(e){}
  var valid = sess && sess.email && sess.ts && (Date.now() - sess.ts < SESSION_TTL_MS);
  var isAdmin = valid && (sess.isAdmin || sess.email === SUPER_ADMIN_EMAIL.toLowerCase());
  if (!isAdmin) {
    window.location.replace("portal.html");
  }
})();
</script>

<a href="portal.html" style="position:fixed; top:14px; left:20px; background:#1C1917; color:#C8973A; padding:8px 14px; border-radius:6px; border:1px solid #C8973A; text-decoration:none; font-family:Arial, sans-serif; font-size:11px; font-weight:bold; box-shadow:0 4px 6px rgba(0,0,0,0.2); z-index:9999;">← Menú</a>

<div id="app"></div>
<div class="save-badge" id="save-badge">Guardado ✓</div>

<script>
// ============================================================
// CONEXIÓN A BASE DE DATOS (NUBE) - mismo backend que el resto de las apps
// ============================================================
const API_URL = "/api/portal";
const CLOUD_TOKEN = tokenSesion(); // sesión firmada por el servidor (ver sesion.js)
const ACL_KEY = "accesos_ci_v1";
const SUPER_ADMIN_EMAIL = "a.catalan.valdes@gmail.com";

const MODULOS = [
  { key: "rendicion",    label: "Caja" },
  { key: "clientes",     label: "Clientes" },
  { key: "costos",       label: "Costos" },
  { key: "cotizaciones", label: "Cotizaciones" },
  { key: "dashboard",    label: "Indicadores" },
  { key: "calendario",   label: "Producciones" },
  { key: "proveedores",  label: "Proveedores" },
  { key: "ventasci",     label: "Otros" },
  { key: "ventas",       label: "Sala de venta" },
  { key: "rrhh",         label: "Recursos Humanos" },
  { key: "inventario",   label: "Inventario" },
  { key: "finanzas",     label: "Finanzas" },
  { key: "marketing",    label: "Marketing" },
  { key: "trabajador",   label: "Mi Portal" }
];

const SUBPERMISOS = [
  { key: "costos_nomina", label: "Nómina (Costos)", desc: "Ver pestaña confidencial 'Nómina y Gastos Mensuales' en Costos" }
];

async function saveToCloud(key, dataObj) {
  try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ key: key, value: JSON.stringify(dataObj), token: CLOUD_TOKEN }) }); }
  catch (e) {}
}
async function loadFromCloud(key) {
  try {
    const res = await fetch(API_URL + "?key=" + key + "&token=" + CLOUD_TOKEN);
    const json = await res.json();
    return json.valor ? JSON.parse(json.valor) : null;
  } catch (e) { return null; }
}

var state = { acl: {}, loaded: false, nuevoCorreo: "", estricto: null, cambiandoModo: false };

// ------------------------------------------------------------
// Seguridad del servidor: modo estricto
// ------------------------------------------------------------
// Mientras el modo estricto está desactivado ("transición"), el servidor
// sigue aceptando el token antiguo que estaba publicado en las páginas, para
// que nada se corte durante el cambio. Al activarlo, solo se aceptan las
// sesiones iniciadas con Google o Microsoft, cada una con sus propios permisos.
async function cargarModo() {
  try {
    var res = await fetch(API_URL + "?accion=config&token=" + encodeURIComponent(CLOUD_TOKEN));
    var j = await res.json();
    state.estricto = j.estado === "éxito" ? !!j.modoEstricto : null;
  } catch (e) { state.estricto = null; }
}
async function cambiarModo(activar) {
  var txt = activar
    ? "¿Activar el modo estricto?\n\nDesde ahora solo se podrá entrar con una sesión de Google o Microsoft, y cada persona verá solo los módulos que tenga asignados. Quien tenga una página abierta desde antes tendrá que volver a iniciar sesión."
    : "¿Volver al modo transición?\n\nEl token antiguo, que está publicado en el repositorio, volverá a dar acceso a TODOS los datos. Úsalo solo si algo dejó de funcionar.";
  if (!confirm(txt)) return;
  state.cambiandoModo = true; render();
  try {
    var res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ accion: "config", token: CLOUD_TOKEN, modoEstricto: !!activar }) });
    var j = await res.json();
    if (j.estado !== "éxito") throw new Error(j.detalle || "error");
    state.estricto = !!j.modoEstricto;
  } catch (e) {
    alert("No se pudo cambiar el modo de seguridad. Inténtalo de nuevo.");
  }
  state.cambiandoModo = false; render();
}
function tarjetaSeguridad() {
  var estado, boton;
  if (state.estricto === null) {
    estado = '<span style="color:var(--muted)">No se pudo consultar el estado del servidor.</span>';
    boton = '<button class="act-btn" onclick="cargarModo().then(render)">Reintentar</button>';
  } else if (state.estricto) {
    estado = '<b style="color:var(--teal)">🔒 Modo estricto activado.</b> Solo se aceptan sesiones iniciadas con Google o Microsoft, y cada persona accede únicamente a sus módulos (los trabajadores, solo a su propia información en Mi Portal).';
    boton = '<button class="act-btn" ' + (state.cambiandoModo ? 'disabled' : '') + ' onclick="cambiarModo(false)">Volver a modo transición</button>';
  } else {
    estado = '<b style="color:#B45309">⚠️ Modo transición.</b> El token antiguo, que está publicado en el repositorio, todavía da acceso a todos los datos. Actívalo cuando hayas comprobado que todos pueden entrar con normalidad.';
    boton = '<button class="act-btn primary" ' + (state.cambiandoModo ? 'disabled' : '') + ' onclick="cambiarModo(true)">🔒 Activar modo estricto</button>';
  }
  return '<div class="card"><div class="card-title">Seguridad del servidor</div>' +
    '<div class="help" style="margin-bottom:12px">' + estado + '</div>' + boton + '</div>';
}

function normEmail(e) { return (e || "").trim().toLowerCase(); }

function guardarAcl() {
  localStorage.setItem(ACL_KEY, JSON.stringify(state.acl));
  saveToCloud(ACL_KEY, state.acl);
  var badge = document.getElementById("save-badge");
  if (badge) {
    badge.style.display = "block";
    clearTimeout(window.__badgeTimeout);
    window.__badgeTimeout = setTimeout(function(){ badge.style.display = "none"; }, 1500);
  }
}

function toggleModulo(email, modKey, checked) {
  if (!state.acl[email]) state.acl[email] = { admin: false, modules: [] };
  var mods = state.acl[email].modules || [];
  var idx = mods.indexOf(modKey);
  if (checked && idx === -1) mods.push(modKey);
  if (!checked && idx !== -1) mods.splice(idx, 1);
  state.acl[email].modules = mods;
  guardarAcl();
}

function toggleSinMontos(email, checked) {
  if (!state.acl[email]) state.acl[email] = { admin: false, modules: [] };
  if (checked) state.acl[email].sinMontos = true; else delete state.acl[email].sinMontos;
  guardarAcl();
}

function toggleAdmin(email, checked) {
  if (!state.acl[email]) state.acl[email] = { admin: false, modules: [] };
  state.acl[email].admin = checked;
  guardarAcl();
  render();
}

function eliminarPersona(email) {
  if (!confirm("¿Quitar todo acceso a " + email + "?")) return;
  delete state.acl[email];
  guardarAcl();
  render();
}

function agregarPersona() {
  var email = normEmail(state.nuevoCorreo);
  if (!email || email.indexOf("@") === -1) { alert("Ingresa un correo Gmail o Hotmail válido."); return; }
  if (email === SUPER_ADMIN_EMAIL.toLowerCase()) { alert("Ese correo ya tiene acceso total permanente (administradora principal)."); return; }
  if (!state.acl[email]) state.acl[email] = { admin: false, modules: [] };
  state.nuevoCorreo = "";
  guardarAcl();
  render();
}

function setNuevoCorreo(v) { state.nuevoCorreo = v; }

function render() {
  var emails = Object.keys(state.acl).sort();
  var headCols = MODULOS.map(function(m){ return '<th>' + m.label + '</th>'; }).join('');
  var subHeadCols = SUBPERMISOS.map(function(s){
    return '<th style="background:#2C2926;border-left:2px solid var(--gold);color:#5EEAD4;" title="' + s.desc + '">' + s.label + '</th>';
  }).join('');

  var rows = emails.map(function(email){
    var entry = state.acl[email] || { admin: false, modules: [] };
    var mods = entry.modules || [];
    var hasAdmin = !!entry.admin;
    var hasRrhh = hasAdmin || mods.indexOf('rrhh') !== -1;

    var modCells = MODULOS.map(function(m){
      var checked = hasAdmin || mods.indexOf(m.key) !== -1;
      var disabled = hasAdmin ? 'disabled title="Tiene acceso total (Admin)"' : '';
      return '<td><input type="checkbox" ' + (checked ? 'checked' : '') + ' ' + disabled + ' onchange="toggleModulo(\'' + email + '\',\'' + m.key + '\',this.checked)"></td>';
    }).join('');

    var subCells = SUBPERMISOS.map(function(s){
      var checked = hasAdmin || hasRrhh || mods.indexOf(s.key) !== -1;
      var disabled = hasAdmin
        ? 'disabled title="Tiene acceso total (Admin)"'
        : (hasRrhh ? 'disabled title="Incluido automáticamente por tener acceso a Recursos Humanos"' : 'title="' + s.desc + '"');
      return '<td style="background:#FAF8F5;border-left:2px solid #E7E2D9;"><input type="checkbox" ' + (checked ? 'checked' : '') + ' ' + disabled + ' onchange="toggleModulo(\'' + email + '\',\'' + s.key + '\',this.checked)"></td>';
    }).join('');

    return '<tr>' +
      '<td class="email-col">' + email + '</td>' +
      modCells +
      subCells +
      '<td style="background:#FAF8F5;border-left:2px solid #E7E2D9;"><input type="checkbox" ' + (!hasAdmin && entry.sinMontos ? 'checked' : '') + ' ' + (hasAdmin ? 'disabled title="Los administradores siempre ven los montos"' : 'title="No ve valor total, abono, saldo ni pagos en Producciones"') + ' onchange="toggleSinMontos(\'' + email + '\',this.checked)"></td>' +
      '<td><input type="checkbox" ' + (entry.admin ? 'checked' : '') + ' onchange="toggleAdmin(\'' + email + '\',this.checked)" title="Acceso total a todos los módulos"></td>' +
      '<td><button class="icon-btn" onclick="eliminarPersona(\'' + email + '\')" title="Quitar acceso">🗑️</button></td>' +
    '</tr>';
  }).join('');

  var tableOrEmpty = emails.length === 0
    ? '<div class="empty-state">Todavía no le has dado acceso a nadie. Agrega un correo abajo.</div>'
    : '<div style="overflow-x:auto"><table><thead><tr><th class="email-col">Correo</th>' + headCols + subHeadCols + '<th style="background:#2C2926;border-left:2px solid var(--gold);color:#5EEAD4;" title="No ve valor total, abono, saldo ni pagos en Producciones">Sin montos</th><th>Admin</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';

  var html =
    '<div class="topbar"><div class="access-brand-logo" aria-label="Creamos Imagen"></div></div>' +
    '<div class="content">' +
      '<div class="card">' +
        '<div class="card-title">Quién puede entrar, y a qué</div>' +
        '<div class="help">Marca los módulos a los que cada correo puede entrar. <b>Admin</b> da acceso a todos los módulos. La columna especial <b>Nómina (Costos)</b> permite dar acceso a la pestaña confidencial de nóminas/gastos en Costos a usuarios específicos (el equipo de <b>RRHH</b> ya lo tiene habilitado de forma automática sin necesidad de ser Admin). <b>Sin montos</b> oculta el valor total, abono, saldo y pagos en Producciones (por ejemplo, para diseñadores); la persona debe volver a abrir el menú para que se aplique en su pantalla. Los cambios se guardan solos.</div>' +
        '<div class="super-note">🔒 <b>' + SUPER_ADMIN_EMAIL + '</b> siempre tiene acceso total a todo, aunque no aparezca en esta lista (es la cuenta administradora principal, por seguridad).</div>' +
        tableOrEmpty +
        '<div class="add-row">' +
          '<input type="email" placeholder="correo@gmail.com o @hotmail.com" value="' + state.nuevoCorreo + '" oninput="setNuevoCorreo(this.value)" onkeydown="if(event.key===\'Enter\')agregarPersona()">' +
          '<button class="act-btn primary" onclick="agregarPersona()">+ Agregar Persona</button>' +
        '</div>' +
      '</div>' +
      tarjetaSeguridad() +
      '<div class="card"><div class="card-title" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">Bitácora de cambios' +
        '<span style="display:flex;gap:8px"><input id="bit-filtro" placeholder="Filtrar por persona, módulo o detalle" value="' + (state.bitFiltro || '') + '" oninput="state.bitFiltro=this.value;renderBitacora()" style="background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;min-width:240px">' +
        '<button class="act-btn" onclick="cargarBitacora()">↻ Actualizar</button></span></div>' +
        '<div class="help">Quién guardó qué y cuándo (últimos 400 movimientos). En <b style="color:var(--red)">rojo</b>, los guardados que dejaron menos registros que antes: revísalos si no fueron borrados a propósito. El registro completo está en la hoja "Bitácora" de la planilla.</div>' +
        '<div id="bitacora"><div class="empty-state">Cargando…</div></div></div>' +
      '<div class="card"><div class="card-title">Recuperar Caja desde el historial</div>' +
        '<div class="help">Trae los registros de Caja desde una versión anterior de la planilla (la última antes de la fecha y hora indicadas) y los agrega a la Caja actual. No borra ni cambia nada de lo que hay hoy: solo agrega las filas que falten. Primero presiona <b>Ver qué se recupera</b> y revisa los totales.</div>' +
        '<div class="add-row" style="align-items:center">' +
          '<label style="font-size:12.5px">Solo los días desde: <input type="date" id="rec-desde" style="background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:6px 10px"></label>' +
          '<label style="font-size:12.5px">hasta: <input type="date" id="rec-hasta" style="background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:6px 10px"></label>' +
          '<button class="act-btn" onclick="explorarCaja()" title="Revisa una versión por día y muestra cuántos registros del rango tenía cada una">🔎 Buscar en qué versión están</button>' +
        '</div>' +
        '<div id="rec-explorar"></div>' +
        '<div class="add-row" style="align-items:center">' +
          '<label style="font-size:12.5px">Versión anterior a: <input type="datetime-local" id="rec-antes" value="2026-11-08T23:05" style="background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:6px 10px"></label>' +
          '<label style="font-size:12.5px">o desde una copia: <input type="url" id="rec-copia" placeholder="Enlace de la copia de la planilla (opcional)" style="background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;min-width:280px"></label>' +
          '<button class="act-btn" onclick="recuperarCaja(false)">🔍 Ver qué se recupera</button>' +
          '<button class="act-btn primary" id="rec-aplicar" onclick="recuperarCaja(true)" disabled>↺ Recuperar</button>' +
        '</div>' +
        '<div id="rec-resultado"></div></div>' +
    '</div>';

  document.getElementById("app").innerHTML = html;
  renderBitacora();
}

// ============================================================
// BITÁCORA (solo administradores; la arma el servidor en cada guardado)
// ============================================================
var NOMBRES_LLAVE = [
  [/^accesos_ci_v1/, "Accesos"], [/^clientes_ci_v1/, "Clientes"], [/^costos_ci_v1/, "Costos"],
  [/^(cotizaciones|tarifario)_ci_v1/, "Cotizaciones"], [/^(compras|proveedores)_ci_v1/, "Proveedores"],
  [/^creamos_imagen_v1/, "Otros (ventas)"], [/^sublipro_v2/, "Sala de venta"], [/^rendicion/, "Caja"],
  [/^prods\d{4}/, "Producciones"], [/^rrhh_/, "Recursos Humanos"], [/^marketing_ci_v1/, "Marketing"], [/^inventario_ci_v1/, "Inventario"], [/^finanzas_ci_v1/, "Finanzas"], [/^cierres_caja_v1/, "Caja (cierres)"], [/^ordenes_compra_ci_v1/, "Proveedores (OC)"]
];
function nombreLlave(k) {
  for (var i = 0; i < NOMBRES_LLAVE.length; i++) if (NOMBRES_LLAVE[i][0].test(k)) return NOMBRES_LLAVE[i][1] + ' <span style="color:var(--muted);font-size:11px">(' + k + ')</span>';
  return k;
}
async function cargarBitacora() {
  try {
    var res = await fetch(API_URL + "?accion=bitacora&token=" + encodeURIComponent(CLOUD_TOKEN));
    var j = await res.json();
    if (j.estado === 'error') throw new Error(j.detalle);
    state.bitacora = j.filas || [];
  } catch (e) {
    state.bitacora = null; state.bitError = e.message;
  }
  renderBitacora();
}
// La hora se interpreta en Chile (la planilla y la bitácora usan hora de Chile).
function isoChile(local) {
  var d = new Date(local + ':00Z');
  var enChile = new Date(d.toLocaleString('en-US', { timeZone: 'America/Santiago' }));
  var enUtc = new Date(d.toLocaleString('en-US', { timeZone: 'UTC' }));
  return new Date(d.getTime() + (enUtc - enChile)).toISOString();
}
async function recuperarCaja(aplicar) {
  var antes = document.getElementById('rec-antes').value;
  var cont = document.getElementById('rec-resultado');
  var copia = document.getElementById('rec-copia').value.trim();
  if (!antes && !copia) { alert('Indica la fecha y hora, o el enlace de la copia.'); return; }
  if (aplicar && !confirm('Se agregarán a la Caja las filas que se muestran. Lo que hay hoy en la Caja no se toca. ¿Continuar?')) return;
  cont.innerHTML = '<div class="empty-state">⏳ Leyendo el historial de la planilla… (puede tardar un minuto)</div>';
  try {
    var res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion: 'recuperarCaja', antesDe: antes ? isoChile(antes) : '', archivo: copia, desde: document.getElementById('rec-desde').value, hasta: document.getElementById('rec-hasta').value, aplicar: !!aplicar, token: CLOUD_TOKEN }) });
    var j = await res.json();
    if (j.estado === 'error') throw new Error(j.detalle === 'Acción desconocida' ? 'Falta actualizar el Apps Script.' : j.detalle);
    var meses = Object.keys(j.porMes || {}).sort();
    var fmtP = function (n) { return '$' + Math.round(n).toLocaleString('es-CL'); };
    var fecha = isNaN(new Date(j.versionPlanilla)) ? j.versionPlanilla : new Date(j.versionPlanilla).toLocaleString('es-CL', { timeZone: 'America/Santiago' });
    cont.innerHTML = '<div class="help" style="margin-top:10px">Versión de la planilla usada: <b>' + escB(fecha) + '</b>. ' +
      (j.aplicado ? '<b style="color:var(--teal,#0D7A6B)">✓ Se recuperaron ' + j.filas + ' fila(s).</b> Recarga Caja (F5) para verlas.' : (j.filas ? 'Se recuperarían <b>' + j.filas + '</b> fila(s):' : 'No falta nada: la Caja actual ya tiene todo lo de esa versión.')) + '</div>' +
      (meses.length ? '<table><thead><tr><th>Mes</th><th>Días</th><th>Filas</th><th>Monto</th></tr></thead><tbody>' +
        meses.map(function (m) { var x = j.porMes[m]; return '<tr><td>' + m + '</td><td>' + x.dias + '</td><td>' + x.filas + '</td><td>' + fmtP(x.monto) + '</td></tr>'; }).join('') + '</tbody></table>' : '');
    document.getElementById('rec-aplicar').disabled = !!j.aplicado || !j.filas;
  } catch (e) {
    cont.innerHTML = '<div class="empty-state">No se pudo: ' + escB(e.message) + '</div>';
  }
}
// Busca, versión por versión (una por día), cuántos registros del rango tenía
// la Caja. Trabaja por tandas: "Seguir buscando" continúa hacia atrás.
var explorar = { filas: [], actual: null };
async function explorarCaja(seguir) {
  var desde = document.getElementById('rec-desde').value, hasta = document.getElementById('rec-hasta').value;
  if (!desde || !hasta) { alert('Indica el rango de días a buscar (desde y hasta).'); return; }
  if (!seguir) explorar = { filas: [], actual: null };
  // Las versiones que dieron error al final se vuelven a intentar.
  while (explorar.filas.length && explorar.filas[explorar.filas.length - 1].error) explorar.filas.pop();
  var cont = document.getElementById('rec-explorar');
  var antesDeDia = seguir && explorar.filas.length ? explorar.filas[explorar.filas.length - 1].dia : '';
  cont.innerHTML = tablaExplorar() + '<div class="empty-state">⏳ Revisando versiones… (hasta minuto y medio por tanda)</div>';
  try {
    var res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ accion: 'explorarCaja', desde: desde, hasta: hasta, antesDeDia: antesDeDia, token: CLOUD_TOKEN }) });
    var j = await res.json();
    if (j.estado === 'error') throw new Error(j.detalle === 'Acción desconocida' ? 'Falta actualizar el Apps Script.' : j.detalle);
    explorar.actual = j.actual;
    explorar.filas = explorar.filas.concat(j.versiones || []);
    explorar.incompleto = j.incompleto;
    cont.innerHTML = tablaExplorar();
  } catch (e) {
    cont.innerHTML = tablaExplorar() + '<div class="empty-state">No se pudo: ' + escB(e.message) + '</div>';
  }
}
function tablaExplorar() {
  if (!explorar.actual) return '';
  var fmtP = function (n) { return '$' + Math.round(n || 0).toLocaleString('es-CL'); };
  var meses = {};
  [explorar.actual].concat(explorar.filas).forEach(function (v) { Object.keys(v.porMes || {}).forEach(function (m) { meses[m] = 1; }); });
  meses = Object.keys(meses).sort();
  var celdasMes = function (v) { return meses.map(function (m) { return '<td>' + (v.error || v.sinCaja ? '' : ((v.porMes || {})[m] || 0)) + '</td>'; }).join(''); };
  return '<div class="help" style="margin-top:10px">Hoy la Caja tiene <b>' + explorar.actual.filas + '</b> registro(s) en ese rango, por ' + fmtP(explorar.actual.monto) + ' (' + meses.map(function (m) { return m + ': ' + ((explorar.actual.porMes || {})[m] || 0); }).join(' · ') + '). Elige la versión con más registros y presiona <b>Usar</b>; después revisa con <b>Ver qué se recupera</b>.</div>' +
    '<div style="max-height:320px;overflow-y:auto"><table><thead><tr><th>Versión (día)</th><th>Registros en el rango</th>' + meses.map(function (m) { return '<th>' + m + '</th>'; }).join('') + '<th>Monto</th><th></th></tr></thead><tbody>' +
    explorar.filas.map(function (v) {
      var hora = new Date(v.version).toLocaleString('es-CL', { timeZone: 'America/Santiago' });
      return '<tr><td>' + escB(hora) + '</td><td>' + (v.error ? 'Error: ' + escB(v.error) : v.sinCaja ? 'Sin Caja' : v.filas) + '</td>' + celdasMes(v) + '<td>' + (v.error || v.sinCaja ? '' : fmtP(v.monto)) + '</td>' +
        '<td>' + (v.filas ? '<button class="act-btn" onclick="usarVersion(\'' + v.version + '\')">Usar</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    (explorar.incompleto || (explorar.filas.length && explorar.filas[explorar.filas.length - 1].error) ? '<div class="add-row"><button class="act-btn" onclick="explorarCaja(true)">⏬ Seguir buscando más atrás</button></div>' : '');
}
// Deja el campo "Versión anterior a" un minuto después de esa versión, para que se use justo esa.
function usarVersion(iso) {
  var d = new Date(new Date(iso).getTime() + 60000);
  var p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Santiago', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
  document.getElementById('rec-antes').value = p.year + '-' + p.month + '-' + p.day + 'T' + p.hour + ':' + p.minute;
  document.getElementById('rec-copia').value = '';
  document.getElementById('rec-antes').scrollIntoView({ block: 'center' });
}
function escB(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderBitacora() {
  var cont = document.getElementById('bitacora'); if (!cont) return;
  if (state.bitacora === undefined) return;
  if (state.bitacora === null) { cont.innerHTML = '<div class="empty-state">No se pudo cargar la bitácora: ' + escB(state.bitError) + '</div>'; return; }
  var f = (state.bitFiltro || '').toLowerCase();
  var filas = state.bitacora.filter(function (r) { return !f || (r.usuario + ' ' + r.accion + ' ' + r.detalle + ' ' + nombreLlave(r.detalle)).toLowerCase().indexOf(f) !== -1; });
  if (!filas.length) { cont.innerHTML = '<div class="empty-state">Sin movimientos' + (f ? ' para ese filtro' : ' todavía') + '.</div>'; return; }
  cont.innerHTML = '<div style="overflow-x:auto;max-height:480px;overflow-y:auto"><table><thead><tr><th>Fecha</th><th class="email-col">Usuario</th><th>Acción</th><th class="email-col">Módulo / detalle</th><th>Registros</th></tr></thead><tbody>' +
    filas.map(function (r) {
      var menos = r.regAntes !== '' && r.regDespues !== '' && Number(r.regDespues) < Number(r.regAntes);
      var reg = r.regAntes === '' && r.regDespues === '' ? '' : (r.regAntes === '' ? '' : r.regAntes + ' → ') + r.regDespues;
      return '<tr' + (menos ? ' style="background:#FEF2F2"' : '') + '><td style="white-space:nowrap">' + escB(r.fecha) + '</td><td class="email-col">' + escB(r.usuario) + '</td><td>' + escB(r.accion) + '</td>' +
        '<td class="email-col" style="font-weight:400">' + (r.accion === 'guardar' ? nombreLlave(escB(r.detalle)) : escB(r.detalle)) + '</td>' +
        '<td style="white-space:nowrap' + (menos ? ';color:var(--red);font-weight:700' : '') + '">' + escB(reg) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

async function initApp() {
  var resultados = await Promise.all([loadFromCloud(ACL_KEY), cargarModo()]);
  var acl = resultados[0];
  if (acl) state.acl = acl;
  else {
    var raw = localStorage.getItem(ACL_KEY);
    if (raw) { try { state.acl = JSON.parse(raw); } catch(e){} }
  }
  state.loaded = true;
  render();
  cargarBitacora();
}

initApp().finally(ocultarCargando);
</script>
